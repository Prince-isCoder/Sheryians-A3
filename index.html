<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too Yumm</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <section>
            <nav>
                <div class="logo"><img src="./images/logo.png" alt=""></div>
                <div class="nav-links">
                    <a href="">HOME</a>
                    <a href="">ABOUT</a>
                    <a href="">CHIPS</a>
                    <a href="">SERVICES</a>
                    <a href="">CONTACT</a>
                </div>
                <div class="search-box">
                    <span class="icon"><i class="ri-search-line"></i></span>
                    <input type="text" placeholder="Search for chips..." class="search-bar">
                    <div class="line"></div>
                    <div class="cart">
                        <i class="ri-shopping-bag-fill"></i>
                    </div>
                    <div class="cart-count">4</div>

                </div>
            </nav>
            <div class="hero-section">
                <div class="main-heading">
                    <div class="tag-ingredients">
                        <span><i class="ri-star-fill"></i></span>
                        <h6>100% REAL INGREDIENTS</h6>
                    </div>
                    <div class="heading">
                        <h1>EAT OUR <span>GRILLED</span> <br> POTATO CHIPS</h1>
                    </div>
                    <div class="sub-heading">
                        <p>Satisfying savory Chinese meat sauce chips <br> without any hard-to-find ingredients.</p>
                    </div>
                    <div class="cart-plus-minus-button">
                        <div class="add-to-cart-button">
                            <span class="cart-img"><i class="ri-shopping-bag-fill"></i></span>
                            <div>ADD TO CART</div>
                        </div>
                        <div class="inc-dec-button">
                            <span>-</span>
                            <span>|</span>
                            <span style="color: red;">2</span>
                            <span>|</span>
                            <span>+</span>
                        </div>
                    </div>
                </div>
                <div class="image">image</div>
            </div>
        </section>
    </main>
</body>

</html>
